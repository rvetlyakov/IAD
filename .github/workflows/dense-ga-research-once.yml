name: "Dense GA hyperparameter study - 35 measured sizes"
on:
  push:
    branches:
      - "research/dense-ofat-20261027"
    paths:
      - ".github/workflows/dense-ga-research-once.yml"
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install scientific libraries and Montserrat
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-montserrat
          python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2' 'matplotlib>=3.9,<4'
      - name: Baseline regression suite including original GA
        run: python -m unittest discover -s tests -v
      - name: Generate 1855 measured OFAT points plus independent holdout
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u lab1/dense_research.py --stage all --output results/dense_ofat_20261027
      - name: Render 30 clean, smooth, evidence-grounded curves
        run: |
          python -u lab1/dense_charts.py --root results/dense_ofat_20261027
      - name: Validate reproducibility and cardinalities
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          d=Path('results/dense_ofat_20261027')
          load=lambda n:list(csv.DictReader((d/n).open()))
          r=load('sweep_raw.csv');h=load('holdout_raw.csv')
          m=json.loads((d/'methodology.json').read_text())
          assert len(r)==1855,len(r)
          assert len(h)==96,len(h)
          assert len(m['levels'])==15
          assert m['grid']['medium']==list(range(100,501,50))
          assert m['grid']['large']==list(range(1000,2001,100))
          assert m['grid']['transition']==list(range(550,1000,50))
          for x in r:
              fixed=json.loads(x['context_json'])
              cfg=json.loads(x['settings_json'])
              changed={k for k in cfg if cfg[k]!=fixed[k]}
              assert changed<= {x['parameter']},(x['parameter'],changed)
              assert int(x['total_population'])==cfg['population']
          assert len(list((d/'plots').glob('*.png')))==30
          assert len(list((d/'plots').glob('*.svg')))==30
          print('VERIFIED: 1855 real OFAT samples, 96 independent holdout cases, 60 graphics')
          PY
      - name: Commit reproducible research results to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/dense_ofat_20261027
          git commit -m "results: dense measured OFAT with holdout and 30 slide-ready charts"
          git fetch origin research/dense-ofat-20261027
          git rebase origin/research/dense-ofat-20261027
          git push origin HEAD:research/dense-ofat-20261027
      - name: Preserve CSV and graph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dense-GA-all-real-measurements
          path: results/dense_ofat_20261027
          if-no-files-found: ignore
          retention-days: 90
