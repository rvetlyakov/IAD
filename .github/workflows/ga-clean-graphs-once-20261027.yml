name: Publish clean standalone GA hyperparameter charts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ga-clean-graphs-once-20261027.yml

permissions:
  contents: write

jobs:
  clean-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Montserrat and chart runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-montserrat
          python -m pip install 'numpy>=2.1,<3' 'scipy>=1.14,<2' 'matplotlib>=3.9,<4' pillow
          fc-match Montserrat
      - name: Render clean plots from immutable measured CSV
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, sys
          sys.path.insert(0, 'lab1')
          from hyperparameter_curves import render_parameter,HYPERPARAMETERS
          from PIL import Image
          p = Path('results/hyperparameter_curves_10_2000')
          rows = list(csv.DictReader((p/'summary.csv').open(encoding='utf8')))
          assert len(rows)==465, 'Expected 465 measured parameter/size values'
          for parameter in HYPERPARAMETERS:
              render_parameter(parameter, rows, p/'plots', mode='full', repeats=1)
              image=Image.open(p/'plots'/f'{parameter}.png')
              assert image.size[0] >= 2000 and image.size[1] >= 1000
              # Standalone axes only: no header banner or explanatory sidebar.
              w,h=image.size
              assert all(sum(image.convert('RGB').getpixel((x,y)))>735
                         for x,y in ((w-8,8),(w-8,h//2),(8,8)))
          assert len(list((p/'plots').glob('*.png')))==10
          assert len(list((p/'plots').glob('*.svg')))==10
          print('10 clean data-only graphs validated from real 465-run summary')
          PY
      - name: Commit clean plots into main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/hyperparameter_curves_10_2000/plots/
          git commit -m 'viz: clean standalone measured hyperparameter charts' || exit 0
          git push origin HEAD:main
      - name: Upload ten clean PNG and SVG pairs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IAD-clean-hyperparameter-graphs
          path: results/hyperparameter_curves_10_2000/plots/
          retention-days: 30
          if-no-files-found: ignore
