name: Presentation-quality measured GA curves

on:
  push:
    branches:
      - "fix/scale-island-benchmark-20261026"
    paths:
      - ".github/workflows/ga-curves-once-20261027.yml"

permissions:
  contents: write

jobs:
  real-curves:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Montserrat for exact slide typography
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-montserrat
          fc-match Montserrat
      - name: Install scientific dependencies
        run: python -m pip install 'numpy>=2.1,<3' 'scipy>=1.14,<2' 'matplotlib>=3.9,<4'
      - name: Compile modules and test curves
        run: |
          python -m compileall -q lab1/scale_curve_research.py tests/test_scale_curve_research.py
          python -m unittest discover -s tests -p 'test_scale_curve_research.py' -v
      - name: Measure 11 real sizes per class with two paired test matrices
        run: python -u lab1/scale_curve_research.py --mode full --repeats 2 --workers 2 --output results/scale_curves_100_2000
      - name: Verify real measurements before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          p=Path('results/scale_curves_100_2000')
          d=json.loads((p/'metadata.json').read_text())
          assert d['mode']=='full' and d['status']=='complete'
          assert set(d['size_grids'])=={'small','medium','large'}
          assert all(len(v)==11 for v in d['size_grids'].values())
          rows=list(csv.DictReader((p/'raw.csv').open()))
          assert len(rows)==3*11*2*2
          assert len(list((p/'plots').glob('*.png')))==6
          assert len(list((p/'plots').glob('*.svg')))==6
          print('Validated:',len(rows),'real evaluations and 12 graphics')
          PY
      - name: Commit verified data and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/scale_curves_100_2000
          git commit -m "results: 11 observed sizes per class, Montserrat curves for presentation"
          git push origin HEAD:fix/scale-island-benchmark-20261026
      - name: Preserve all full curves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-GA-presentation-curves
          path: results/scale_curves_100_2000
          if-no-files-found: ignore
          retention-days: 90
