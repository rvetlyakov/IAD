name: "GA: dense measured curves and independently tuned classes"
on:
  push:
    branches:
      - "research/verified-dense-hyperparameters-20261027"
    paths:
      - ".github/workflows/ga-dense-science-once.yml"
permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install scipy numpy matplotlib
      - run: python -m unittest discover -s tests -p test_dense_assignment_research.py -v

  dense-ofat:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencies and Montserrat
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-montserrat
          python -m pip install scipy numpy matplotlib
      - name: 36 genuine dimensions including 9 transition sizes; 13 parameters
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u lab1/ga_dense_study.py --mode full --repeats 1 --workers 2 --seed 20261104 --output results/ga_dense_study
      - name: Validate all 1584 real trials and 26 paired graphs
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('results/ga_dense_study')
          m=json.loads((p/'metadata.json').read_text())
          r=list(csv.DictReader((p/'raw.csv').open()))
          assert m['mode']=='full'
          assert len(m['factors'])==13
          assert m['sizes']['medium']==list(range(100,501,40))
          assert m['sizes']['transition']==list(range(550,951,50))
          assert m['sizes']['large']==list(range(1000,2001,100))
          assert len(r)==len(set((x['factor'],x['value'],x['class'],x['size']) for x in r))==1584,len(r)
          assert len(list((p/'plots').glob('*.png')))==26
          assert len(list((p/'plots').glob('*.svg')))==26
          assert all(int(x['ga_cost'])>=int(x['optimal_cost']) for x in r)
          assert all(set(json.loads(x['settings_json']))==set(json.loads(x['basis_json'])) for x in r)
          print('Measured 1584 real unique points, 52 PNG/SVG files')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dense-ofat-raw-and-plots
          path: results/ga_dense_study/
          retention-days: 30
          if-no-files-found: ignore

  tune-classes:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy scipy matplotlib
      - name: Class-specific sequential tuning on training data and fresh holdouts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u lab1/ga_tune_classes.py --mode full --train-repeats 2 --holdout-repeats 3 --workers 2 --seed 20261105 --output results/ga_tuned_classes
      - name: Check holdouts independent and pairwise budget
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          p=Path('results/ga_tuned_classes')
          d=json.loads((p/'best_parameters.json').read_text())
          train=list(csv.DictReader((p/'train_raw.csv').open()))
          hold=list(csv.DictReader((p/'validation_raw.csv').open()))
          assert set(d['classes'])=={'small','medium','large'}
          assert len(hold)==3*2*3*2
          assert {r['matrix_seed'] for r in train}.isdisjoint({r['matrix_seed'] for r in hold})
          assert all(int(r['population'])==json.loads(r['settings_json'])['population'] for r in train)
          assert all(int(r['population'])==json.loads(r['settings_json'])['population'] for r in hold)
          print('PASS',len(train),'training runs; 36 independent paired holdout runs')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-tuning-with-holdouts
          path: results/ga_tuned_classes/
          retention-days: 30
          if-no-files-found: ignore

  compare:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencies and Montserrat
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-montserrat
          python -m pip install scipy numpy matplotlib
      - name: Fair 1/2/4/8-island research with total N=120, G=250
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -u lab1/ga_fair_compare.py --mode full --repeats 2 --workers 2 --seed 20261106 --output results/ga_fair_compare
      - name: Validate 288 paired records and plots
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('results/ga_fair_compare')
          rows=list(csv.DictReader((p/'raw.csv').open()))
          assert len(rows)==36*2*4,len(rows)
          assert all(int(r['population'])==120 and int(r['generations'])==250 for r in rows)
          assert len(list((p/'plots').glob('*.png')))==2
          assert len(list((p/'plots').glob('*.svg')))==2
          print('PASS 288 true paired island comparisons')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fair-island-results
          path: results/ga_fair_compare/
          retention-days: 30
          if-no-files-found: ignore

  publish:
    needs: [dense-ofat,tune-classes,compare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: dense-ofat-raw-and-plots
          path: results/ga_dense_study/
      - uses: actions/download-artifact@v4
        with:
          name: class-tuning-with-holdouts
          path: results/ga_tuned_classes/
      - uses: actions/download-artifact@v4
        with:
          name: fair-island-results
          path: results/ga_fair_compare/
      - name: Commit only verifiable measured data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/ga_dense_study results/ga_tuned_classes results/ga_fair_compare
          git commit -m "results: 36-size dense curves, per-class trained parameters, and fair islands"
          git fetch origin research/verified-dense-hyperparameters-20261027
          git rebase origin/research/verified-dense-hyperparameters-20261027
          git push origin HEAD:research/verified-dense-hyperparameters-20261027
