name: One-time full GA 100-2000 scale study

on:
  push:
    branches:
      - "fix/scale-island-benchmark-20261026"
    paths:
      - ".github/workflows/ga-full-once-20261026.yml"

jobs:
  full-size-study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install required packages
        run: python -m pip install "numpy>=2.1,<3" "scipy>=1.14,<2" "matplotlib>=3.9,<4"
      - name: Verify benchmark syntax
        run: python -m compileall -q lab1/scale_benchmark.py
      - name: Tune and compare all three genuine size classes
        run: python -u lab1/scale_benchmark.py --mode full --workers 2 --repeats 2 --output-dir results/scale_benchmark_full
      - name: Upload actual results, including partial classes if interrupted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-100-2000-full-results
          path: results/scale_benchmark_full/
          if-no-files-found: warn
          retention-days: 90
