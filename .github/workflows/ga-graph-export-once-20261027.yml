name: Verify updated slide graph assets
on:
  push:
    branches:
      - "fix/scale-island-benchmark-20261026"
    paths:
      - ".github/workflows/ga-graph-export-once-20261027.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all slide charts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('results/scale_curves_100_2000/plots')
          assert len(list(p.glob('*.png')))==9
          assert len(list(p.glob('*.svg')))==9
          print([(x.name,x.stat().st_size) for x in sorted(p.glob('*.png'))])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: polished-Montserrat-GA-charts
          path: results/scale_curves_100_2000/plots
          retention-days: 30
