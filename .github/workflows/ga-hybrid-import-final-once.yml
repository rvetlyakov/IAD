name: "Hybrid GA: import verified research and render corrected charts"
on:
  push:
    branches:
      - "feat/hybrid-ga-experiments-20261027"
    paths:
      - ".github/workflows/ga-hybrid-import-final-once.yml"
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Montserrat and scientific dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-montserrat
          python -m pip install 'numpy>=2.1,<3' 'scipy>=1.14,<2' 'matplotlib>=3.9,<4'
      - name: Restore 518 real trials and diagonal controls from completed action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/hybrid_ga_study
          gh run download 40563810339 -R rvetlyakov/IAD --name hybrid-GA-full-measured-results --dir results/hybrid_ga_study
      - name: Measure local candidate widths 4, 8, 16, 32 and polish plots
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -u lab1/hybrid_extend_candidates.py --root results/hybrid_ga_study --seed 20261101
      - name: Confirm improvement across independent controlled experiments
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -u lab1/hybrid_validation.py
      - name: Verify exact paired data and 22 publication-ready charts
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('results/hybrid_ga_study')
          m=json.loads((d/'metadata.json').read_text())
          raw=list(csv.DictReader((d/'raw.csv').open()))
          val=list(csv.DictReader((d/'validation.csv').open()))
          diagonal=list(csv.DictReader((d/'diagonal.csv').open()))
          assert len(raw)==574,len(raw)
          assert len(val)==36,len(val)
          assert len(diagonal)==24,len(diagonal)
          assert len(m['factors'])==11
          assert len(list((d/'plots').glob('*.png')))==22
          assert len(list((d/'plots').glob('*.svg')))==22
          for r in raw:
              cfg=json.loads(r['settings_json'])
              assert cfg['population']==int(r['total_population'])
              assert cfg['islands']==int(r['num_islands'])
              assert cfg['generations']==int(r['generations'])
              assert float(r['error_percent'])>=-1e-9
          for r in val:
              assert int(r['total_population'])==120
              assert int(r['generations'])==250
          print('VERIFIED 574 OFAT runs, 36 holdout runs, 24 diagonal runs, 44 chart files')
          PY
      - name: Commit only genuine observed results and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/hybrid_ga_study/
          git commit -m "results: 574 OFAT measurements, validated hybrid comparisons and 44 charts"
          git fetch origin feat/hybrid-ga-experiments-20261027
          git rebase origin/feat/hybrid-ga-experiments-20261027
          git push origin HEAD:feat/hybrid-ga-experiments-20261027
      - name: Upload measured research files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-GA-validated-charts-and-data
          path: results/hybrid_ga_study/
          if-no-files-found: ignore
          retention-days: 90
