name: Import verified full-size GA results

on:
  push:
    branches:
      - "fix/scale-island-benchmark-20261026"
    paths:
      - ".github/workflows/ga-import-results-once-20261026.yml"

permissions:
  contents: write
  actions: read

jobs:
  import-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified full-size artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/scale_benchmark_full
          gh run download 40376391106 -R rvetlyakov/IAD --name ga-100-2000-full-results --dir results/scale_benchmark_full
      - name: Validate artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path('results/scale_benchmark_full')
          result = json.loads((folder/'best_parameters.json').read_text())
          assert result['mode'] == 'full'
          assert set(result['best_parameters']) == {'small','medium','large'}
          assert set(result['tested_sizes']['medium']) >= {100,300,500}
          assert set(result['tested_sizes']['large']) >= {1000,1500,2000}
          for name in ('comparison.csv', 'tuning.csv', 'summary.csv'):
              assert (folder/name).exists(), name
          assert len(list((folder/'plots').glob('*.png'))) == 6
          print('Validated three classes and six plots')
          PY
      - name: Commit measured research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/scale_benchmark_full/
          git commit -m "results: measured GA performance for 100-2000 matrices"
          git push origin HEAD:fix/scale-island-benchmark-20261026
