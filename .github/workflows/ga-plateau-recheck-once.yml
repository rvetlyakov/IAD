name: Corrected plateau sensitivity on 10–2000 matrices
on:
  push:
    branches:
      - "fix/ga-methodology-and-core-20261027"
    paths:
      - ".github/workflows/ga-plateau-recheck-once.yml"
permissions:
  contents: write
jobs:
  real-plateau:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install scientific runtime and Montserrat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-montserrat
          python -m pip install 'numpy>=2.1,<3' 'scipy>=1.14,<2' 'matplotlib>=3.9,<4'
      - name: Run full regression tests before experiment
        run: python -m unittest discover -s tests -v
      - name: Measure corrected plateau thresholds and limits, two paired repeats
        run: |
          python -u lab1/hyperparameter_curves.py --mode full --parameters plateau_limit plateau_diff --repeats 2 --workers 2 --seed 20261029 --output-dir results/plateau_corrected_20261027
      - name: Verify measured rows and exact hyperparameter snapshots
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('results/plateau_corrected_20261027')
          data = json.loads((p/'metadata.json').read_text())
          assert data['mode']=='full'
          assert data['completed_parameters']==['plateau_limit','plateau_diff']
          rows=list(csv.DictReader((p/'raw.csv').open()))
          assert len(rows)==15*2*(3+5), len(rows)
          assert set(r['class'] for r in rows)=={'small','medium','large'}
          assert all('settings_json' in r for r in rows)
          assert all(json.loads(r['settings_json'])[r['parameter']]==float(r['value']) for r in rows)
          assert len(list((p/'plots').glob('*.png')))==2
          assert len(list((p/'plots').glob('*.svg')))==2
          print('VERIFIED',len(rows),'real trials; both parameter graphs')
          PY
      - name: Commit actual finished experimental results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/plateau_corrected_20261027/
          git commit -m "results: corrected plateau sensitivity at 10-2000 dimensions"
          git push origin HEAD:fix/ga-methodology-and-core-20261027
      - name: Preserve measurements even if interrupted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-plateau-real-data
          path: results/plateau_corrected_20261027/
          if-no-files-found: warn
          retention-days: 90
