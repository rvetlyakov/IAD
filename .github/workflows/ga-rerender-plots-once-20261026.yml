name: Regenerate scientifically-scaled benchmark plots

on:
  push:
    branches:
      - "fix/scale-island-benchmark-20261026"
    paths:
      - ".github/workflows/ga-rerender-plots-once-20261026.yml"

permissions:
  contents: write

jobs:
  rerender:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install plotting dependencies
        run: python -m pip install numpy scipy matplotlib
      - name: Render plots using measured summary (no rerun of GA)
        run: |
          python - <<'PY'
          import csv
          import sys
          from pathlib import Path
          sys.path.insert(0, 'lab1')
          from scale_benchmark import plot_comparison
          path = Path('results/scale_benchmark_full')
          rows = list(csv.DictReader((path/'summary.csv').open()))
          for row in rows:
              row['size'] = int(row['size'])
              row['mean_relative_gap'] = float(row['mean_relative_gap'])
              row['mean_seconds'] = float(row['mean_seconds'])
          plot_comparison(rows, path)
          assert len(list((path/'plots').glob('*.png'))) == 6
          print('Plots regenerated with zero-based axes')
          PY
      - name: Commit visuals to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/scale_benchmark_full/plots/
          git commit -m "viz: regenerate six benchmark curves with honest zero baselines"
          git push origin HEAD:fix/scale-island-benchmark-20261026
