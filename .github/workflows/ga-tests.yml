name: Genetic algorithm checks
on:
  push:
    branches: [main, "fix/**", "audit/**", "feat/**", "research/**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install scipy matplotlib nbformat nbclient ipykernel
      - name: Compile Python files
        run: python -m compileall -q lab1 tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
